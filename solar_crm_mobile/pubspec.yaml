name: solar_crm_mobile
description: "Professional Solar CRM Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Notifications
  firebase_core: ^3.3.0
  firebase_messaging: ^15.0.4
  flutter_local_notifications: ^17.2.1

  # Image Picker for Profile Uploads (Camera / Gallery)
  image_picker: ^1.1.2

  # Permanent File Storage Access
  path_provider: ^2.1.2

  # Network & Interceptors
  dio: ^5.4.3+1

  # State Management
  flutter_riverpod: ^2.5.1

  # Secure Local Storage (JWT Token & User Session)
  flutter_secure_storage: ^9.0.0

  # Charts (For Visual Sales & Admin Analytics)
  fl_chart: ^0.68.0

  # Google Fonts & UI Enhancements
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Date Picker, Formatting & Utilities
  intl: ^0.19.0
  url_launcher: ^6.2.6 # Direct Phone Calls & WhatsApp Triggers

  # High-Quality PDF Generation & Sharing
  pdf: ^3.10.8
  printing: ^5.11.1

  # File/Text Sharing (CSV export from Manager Dashboard)
  share_plus: ^7.2.2

  # Cached Network Image (For Profile Photos & URLs)
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App Icon Configuration (Using assets/images/logo.png)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"